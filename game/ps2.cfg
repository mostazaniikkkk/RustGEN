; Opciones del juego en PlayStation 2.

; Screenpack: el system.def con el menú, la selección de personaje y demás
; pantallas. Los personajes y escenarios salen de su select.def.
;   data/system.def       el de MUGEN por defecto
;   data/kfm/system.def   el de Kung Fu Man, con logo e intro
; Si se deja vacío no hay menús: arranca directo en una pelea entre p1 y p2.
motif = data/system.def

; Pelea directa (sólo sin screenpack): carpetas de chars/ y archivo de stages/.
p1 = kfm
p2 = kfm
stage = kfm

; Modo de vídeo:
;   448i  320x448 entrelazado. Se ve la imagen completa (por defecto).
;   240p  320x240 sin entrelazar, píxel a píxel. Según la tele o el
;         emulador se pierden unas 8 líneas arriba y abajo.
video = 448i

; Sprites bajo demanda. Un archivo de sprites que descomprimido pase de
; `stream` KB no se descomprime entero al cargar: se queda comprimido en
; memoria y cada sprite se descomprime la primera vez que se dibuja.
; `stream.cache` son los KB de sprites ya descomprimidos que se guardan por
; archivo. Con `stream = 0` todo va bajo demanda.
stream = 4096
stream.cache = 1024

; Opciones de fábrica del menú OPTIONS. Lo que el jugador cambie en el menú
; se guarda en la tarjeta de memoria (ranura 1, carpeta RUSTGEN) y manda
; sobre esto.
;   difficulty  1 (fácil) a 8 (difícil)
;   life        vida inicial, en %: de 30 a 200, de 10 en 10
;   time        segundos de cada ronda: 30, 40 ... 90, 99; 0 = sin límite
;   speed       -9 (lento) a 9 (rápido); 0 = normal; cada paso es un 5 %
;   volume      volumen de los sonidos, de 0 a 100
difficulty = 4
life = 100
time = 99
speed = 0
volume = 100
